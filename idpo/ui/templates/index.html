<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>IDPO Demo Studio</title>
    <link rel="stylesheet" href="/static/styles.css" />
  </head>
  <body>
    <div class="noise"></div>
    <div class="orb orb-a"></div>
    <div class="orb orb-b"></div>
    <main class="shell">
      <header class="hero">
        <div>
          <p class="eyebrow">Document AI Demo</p>
          <h1>IDPO Extraction Studio</h1>
          <p class="subhead">
            Drop a batch, define the fields, and get a structured table with traceable artifacts.
          </p>
        </div>
        <div class="status" id="status-pill">Idle</div>
      </header>

      <section class="grid">
        <div class="panel">
          <h2>Inputs</h2>
          <form id="run-form">
            <label class="block">
              <span>Documents</span>
              <input id="files" type="file" multiple />
              <span class="hint">PDF, PNG, JPG, TIFF, TXT, JSON</span>
            </label>

            <div class="fields">
              <div class="fields-header">
                <span>Fields to extract</span>
                <button type="button" id="add-field" class="ghost">Add field</button>
              </div>
              <div id="field-list"></div>
            </div>

            <label class="block">
              <span>Config path</span>
              <input id="config-path" type="text" value="configs/idpo_research_config.json" />
              <span class="hint">Uses local Ollama when enabled in config.</span>
            </label>

            <button class="primary" type="submit">
              Run Extraction
            </button>
            <p class="hint" id="form-hint"></p>
          </form>
        </div>

        <div class="panel results">
          <div class="results-header">
            <h2>Run Output</h2>
            <div class="downloads">
              <a id="download-entities" class="ghost" href="#" aria-disabled="true">Entities table</a>
              <a id="download-docs" class="ghost" href="#" aria-disabled="true">Docs table</a>
              <a id="download-run" class="ghost" href="#" aria-disabled="true">Run summary</a>
            </div>
          </div>
          <div class="run-meta" id="run-meta">
            <div>
              <span>Run ID</span>
              <strong>--</strong>
            </div>
            <div>
              <span>Docs</span>
              <strong>0</strong>
            </div>
            <div>
              <span>Duration</span>
              <strong>--</strong>
            </div>
          </div>
          <div class="view-tabs">
            <button type="button" class="tab active" data-view="entities">Entities view</button>
            <button type="button" class="tab" data-view="docs">Docs view</button>
          </div>
          <div class="table-wrap">
            <table id="results-table">
              <thead></thead>
              <tbody></tbody>
            </table>
          </div>
        </div>
      </section>
    </main>
    <script src="/static/app.js"></script>
  </body>
</html>
