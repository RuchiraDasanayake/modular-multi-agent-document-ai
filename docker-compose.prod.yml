# Production VPS Deployment with Docker Compose
# Use with: docker-compose -f docker-compose.prod.yml up -d

version: '3.8'

services:
  # ── Database ──
  db:
    image: pgvector/pgvector:pg16
    container_name: docai_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ahmn_db}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"  # Keep internal only
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-ahmn_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - internal

  # ── Cache ──
  redis:
    image: redis:alpine
    container_name: docai_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD:-docai_redis_secret} --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"  # Keep internal only
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-docai_redis_secret}", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512m
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - internal

  # ── AHMN Service (port 8001, internal only) ──
  ahmn:
    build:
      context: .
      dockerfile: ahmn_core/Dockerfile
    container_name: docai_ahmn
    restart: always
    env_file:
      - path: .env.production
        required: false
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-ahmn_db}
      REDIS_HOST: redis
      REDIS_PASSWORD: ${REDIS_PASSWORD:-docai_redis_secret}
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./ahmn_core/output:/app/ahmn_core/output
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8001/health')\""]
      interval: 10s
      timeout: 10s
      retries: 8
      start_period: 90s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - internal

  # ── Guardrails Service (port 8002, internal only) ──
  guardrails:
    build:
      context: .
      dockerfile: guardrails/Dockerfile
    container_name: docai_guardrails
    restart: always
    env_file:
      - path: .env.production
        required: false
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-ahmn_db}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8002/health')\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 120s
    deploy:
      resources:
        limits:
          memory: 3g
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - internal

  # ── XAI-HITL Service (port 8003, internal only) ──
  xai-hitl:
    build:
      context: .
      dockerfile: xai_hitl/Dockerfile
    container_name: docai_xai_hitl
    restart: always
    env_file:
      - path: .env.production
        required: false
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-ahmn_db}
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8003/health')\""]
      interval: 10s
      timeout: 10s
      retries: 10
      start_period: 180s
    deploy:
      resources:
        limits:
          memory: 6g
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - internal

  # ── IDPO Service (port 8004, internal only) ──
  idpo:
    build:
      context: .
      dockerfile: idpo/Dockerfile
    container_name: docai_idpo
    restart: always
    env_file:
      - path: .env.production
        required: false
    environment:
      AHMN_SERVICE_URL: http://ahmn:8001
      GUARDRAILS_SERVICE_URL: http://guardrails:8002
      XAI_HITL_SERVICE_URL: http://xai-hitl:8003
    volumes:
      - ./configs:/app/configs:ro
      - ./inputs:/app/inputs
      - ./runs:/app/runs
    depends_on:
      ahmn:
        condition: service_healthy
      guardrails:
        condition: service_healthy
      xai-hitl:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8004/health')\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 2g
          cpus: "2.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - internal

  # ── API Gateway (port 8000) ──
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: docai_gateway
    restart: always
    env_file:
      - path: .env.production
        required: false
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-ahmn_db}
      REDIS_URL: redis://:${REDIS_PASSWORD:-docai_redis_secret}@redis:6379/1
      AHMN_SERVICE_URL: http://ahmn:8001
      GUARDRAILS_SERVICE_URL: http://guardrails:8002
      XAI_HITL_SERVICE_URL: http://xai-hitl:8003
      IDPO_SERVICE_URL: http://idpo:8004
      BACKEND_CORS_ORIGINS: ${BACKEND_CORS_ORIGINS:-*}
    ports:
      - "0.0.0.0:${GATEWAY_PORT:-8000}:8000"  # Exposed to external
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
      ahmn:
        condition: service_healthy
      guardrails:
        condition: service_healthy
      xai-hitl:
        condition: service_healthy
      idpo:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - internal
      - external

  # ── Frontend (port 3000) ──
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
    container_name: docai_frontend
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_URL:-}
      - INTERNAL_API_URL=http://gateway:8000
      - HOSTNAME=0.0.0.0
    ports:
      - "0.0.0.0:${FRONTEND_PORT:-3000}:3000"  # Exposed to external
    depends_on:
      gateway:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"require('http').get('http://localhost:3000',(r)=>{process.exit(r.statusCode<400?0:1)}).on('error',()=>process.exit(1))\""]
      interval: 15s
      timeout: 10s
      retries: 8
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 1g
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "50m"
        max-file: "5"
    networks:
      - external

networks:
  internal:
    driver: bridge
    internal: true          # No internet access — services talk only to each other
  external:
    driver: bridge          # Frontend + Gateway face the internet

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
