# DocAI Alpha public deployment via Nginx
# Place in /etc/nginx/sites-available/docai
# Enable with: sudo ln -s /etc/nginx/sites-available/docai /etc/nginx/sites-enabled/
# Then: sudo nginx -t && sudo systemctl reload nginx

server {
    listen 80;
    server_name _;

    client_max_body_size 52M;

    # Basic Auth for public alpha (add after htpasswd setup)
    # auth_basic "DocAI Alpha";
    # auth_basic_user_file /etc/nginx/.docai_htpasswd;

    # Serve frontend static files from dist
    root /opt/docai/frontend/dist;
    index index.html;

    # Reverse proxy /api/ to backend on 127.0.0.1:8000
    location /api/ {
        proxy_pass http://127.0.0.1:8000/;
        proxy_http_version 1.1;

        # Pass original request info to backend
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Increase timeouts for long-running extraction
        proxy_read_timeout 300;
        proxy_connect_timeout 300;
        proxy_send_timeout 300;

        # Disable buffering for streaming responses
        proxy_buffering off;
        proxy_request_buffering off;
    }

    # Serve frontend - try file, then dir, then index.html for SPA routing
    location / {
        try_files $uri $uri/ /index.html;
    }
}
