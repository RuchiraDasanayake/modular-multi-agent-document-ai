[project]
name = "idpo"
version = "0.1.0"
description = "Multi-Agent Document AI research prototype with domain-agnostic pipelines"
requires-python = ">=3.10"
readme = "README.md"
dependencies = [
  "numpy>=1.24",
]

[project.optional-dependencies]
ocr = [
  "pytesseract>=0.3.10",
  "pillow>=10.0.0",
  "pdf2image>=1.17.0",
]
pdf = [
  "pypdf>=4.0.0",
]
excel = [
  "openpyxl>=3.1.2",
]
ui = [
  "fastapi>=0.110.0",
  "uvicorn>=0.24.0",
  "python-multipart>=0.0.9",
]
cloud = [
  "openai>=1.30.0",
  "anthropic>=0.28.0",
]

[project.scripts]
idpo = "idpo.cli:main"

[tool.setuptools.packages.find]
include = ["idpo*"]
