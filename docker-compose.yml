services:
  # ── Database ──
  db:
    image: pgvector/pgvector:pg16
    container_name: docai_postgres
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-password}
      POSTGRES_DB: ${POSTGRES_DB:-ahmn_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - ./scripts/init.sql:/docker-entrypoint-initdb.d/init.sql
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-ahmn_db}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── Cache ──
  redis:
    image: redis:alpine
    container_name: docai_redis
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

  # ── AHMN Service (port 8001) ──
  ahmn:
    build:
      context: .
      dockerfile: ahmn_core/Dockerfile
    container_name: docai_ahmn
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-ahmn_db}
      REDIS_HOST: redis
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    # Internal only — not exposed to host

  # ── Guardrails Service (port 8002) ──
  guardrails:
    build:
      context: .
      dockerfile: guardrails/Dockerfile
    container_name: docai_guardrails
    env_file:
      - path: .env
        required: false
    # Stateless — no DB dependency

  # ── XAI-HITL Service (port 8003) ──
  xai-hitl:
    build:
      context: .
      dockerfile: xai_hitl/Dockerfile
    container_name: docai_xai_hitl
    env_file:
      - path: .env
        required: false
    # Stateless — no DB dependency

  # ── IDPO Service (port 8004) ──
  idpo:
    build:
      context: .
      dockerfile: idpo/Dockerfile
    container_name: docai_idpo
    env_file:
      - path: .env
        required: false
    volumes:
      - ./configs:/app/configs
      - ./inputs:/app/inputs
      - ./runs:/app/runs
    # Stateless — no DB dependency

  # ── API Gateway (port 8000) ──
  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    container_name: docai_gateway
    env_file:
      - path: .env
        required: false
    environment:
      POSTGRES_URI: postgresql://${POSTGRES_USER:-user}:${POSTGRES_PASSWORD:-password}@db:5432/${POSTGRES_DB:-ahmn_db}
      AHMN_SERVICE_URL: http://ahmn:8001
      GUARDRAILS_SERVICE_URL: http://guardrails:8002
      XAI_HITL_SERVICE_URL: http://xai-hitl:8003
      IDPO_SERVICE_URL: http://idpo:8004
    ports:
      - "${GATEWAY_PORT:-8000}:8000"
    depends_on:
      db:
        condition: service_healthy
      ahmn:
        condition: service_started
      guardrails:
        condition: service_started
      xai-hitl:
        condition: service_started
      idpo:
        condition: service_started

  # ── Frontend (port 3000) ──
  frontend:
    build:
      context: ./frontend
      args:
        - NEXT_PUBLIC_API_URL=http://localhost:8000
    container_name: docai_frontend
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8000
      - INTERNAL_API_URL=http://gateway:8000
      - HOSTNAME=0.0.0.0
    ports:
      - "3000:3000"
    depends_on:
      - gateway

volumes:
  postgres_data:
